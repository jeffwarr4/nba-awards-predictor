# .github/workflows/nba_mvp_weekly_pages.yml
# ---------------------------------------------------------------
# Weekly NBA MVP board. Runs Saturdays 15:17 UTC (Cloudflare Worker), October–April, plus manual runs.
# Unattended: Basketball-Reference answers from GitHub runners (probe_sources.yml);
# stats.nba.com does not, which is why the old pipeline needed a local refresh.
#
# What it does:
#   1. Checks out stinger-assets as a sibling (headshots + logos for the graphics)
#   2. Runs src/predict_current.py:
#        predictions/{season}/: top10 + 30-deep board CSVs, movement snapshot,
#          chips, board + bubble PNGs, carousel caption
#        predictions/nba_candidates.csv (stinger-assets headshot sync)
#        data/processed/outputs/: the legacy Google Sheet feed
#      It exits 0 with skipped=true when no games were played since the last board
#      (before opening night, after the regular season); every later step is skipped.
#   3. Fails loudly if the top-10 board is empty
#   4. Builds the Canva flats, copies the legacy feed to docs/nba/mvp/, deploys Pages
#   5. Uploads CSVs + PNGs + caption as artifacts and commits predictions/ + docs/nba/mvp/
#
# The model is NOT retrained here — models/nba_mvp_ridge_np.json is committed.
# Retrain locally (python -m src.model.train_mvp) and commit when data changes.
#
# Secrets (repo Settings → Secrets → Actions):
#   ANTHROPIC_API_KEY — chips, Whys and caption; without it those steps are skipped
# ---------------------------------------------------------------

name: NBA MVP Weekly Refresh
run-name: ${{ (github.event_name == 'schedule' || inputs.scheduled == 'true') && 'Weekly NBA MVP (scheduled)' || 'Weekly NBA MVP (manual)' }}

on:
  schedule:
    # Started on time by the stinger-scheduler Cloudflare Worker (stinger-website/scheduler) at 15:17 UTC;
    # this cron is the late backup, and the guard job makes it a no-op once the Worker's run succeeded.
    # Saturdays 17:17 UTC, October–April (regular season). Kept off :00, when
    # GitHub delays or drops scheduled runs.
    - cron: "17 17 * 10-12,1-4 6"
  workflow_dispatch:
    inputs:
      scheduled:
        description: "Started by the scheduler (skips if this slot already ran). Leave false for a manual run."
        required: false
        default: "false"
      force:
        description: "Rebuild even if no games were played since the last board"
        required: false
        default: "false"

permissions:
  actions: read
  contents: write
  pages: write
  id-token: write

concurrency:
  group: nba-mvp-weekly
  cancel-in-progress: false

jobs:
  # Skip a scheduled run when this slot's board is already done. "Scheduled" means GitHub's cron or a
  # dispatch with scheduled=true (the Cloudflare Worker that starts these jobs on time). A late cron after
  # an on-time Worker run would otherwise redo the board and rewrite the AI chips and captions. Runs started
  # by hand from the Actions tab never skip.
  guard:
    runs-on: ubuntu-latest
    outputs:
      skip: ${{ steps.check.outputs.skip }}
    steps:
      - id: check
        env:
          GH_TOKEN: ${{ github.token }}
          SCHEDULED: ${{ github.event_name == 'schedule' || inputs.scheduled == 'true' }}
        run: |
          if [ "$SCHEDULED" != "true" ]; then echo "skip=false" >> "$GITHUB_OUTPUT"; exit 0; fi
          SINCE=$(date -u -d '-20 hours' +%Y-%m-%dT%H:%M:%SZ)
          DONE=$(gh run list -R "${{ github.repository }}" --workflow "nba_mvp_weekly_pages.yml" --status success --created ">=$SINCE" --limit 20 --json databaseId,event,displayTitle --jq '[.[] | select(.databaseId != ${{ github.run_id }})
                       | select(.event == "schedule" or (.displayTitle | endswith("(scheduled)")))] | length')
          echo "Scheduled runs that succeeded since $SINCE: $DONE"
          if [ "$DONE" -gt 0 ]; then
            echo "::notice::This slot's scheduled run already succeeded; skipping."
            echo "skip=true" >> "$GITHUB_OUTPUT"
          else
            echo "skip=false" >> "$GITHUB_OUTPUT"
          fi

  refresh:
    needs: guard
    if: needs.guard.outputs.skip != 'true'
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      # Sibling checkout so STINGER_ASSETS_DIR matches the ../stinger-assets/
      # convention used locally. Asset filenames are lowercase — the runner's
      # filesystem is case-sensitive even though Windows isn't.
      - name: Checkout stinger-assets
        uses: actions/checkout@v4
        with:
          repository: jeffwarr4/stinger-assets
          path: stinger-assets

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      # The Sheet's "prior" tab: whatever was last published to Pages.
      - name: Prepare web_prior_top10.csv (last published board)
        run: |
          mkdir -p data/processed/outputs
          curl -L --fail --silent --show-error -o data/processed/outputs/web_prior_top10.csv \
            "https://jeffwarr4.github.io/nba-awards-predictor/nba/mvp/web_current_top10.csv" \
            || cp data/processed/seeds/mvp_prior_top10_seed.csv data/processed/outputs/web_prior_top10.csv

      - name: Run current-season predictions + weekly board
        id: predict
        run: python -m src.predict_current ${{ github.event.inputs.force == 'true' && '--force' || '' }}
        env:
          PYTHONIOENCODING: utf-8
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          STINGER_ASSETS_DIR: ${{ github.workspace }}/stinger-assets

      # predict_current exits non-zero before writing on an empty or short board;
      # this double-checks the file it wrote so a silent regression can't publish a header-only CSV.
      - name: Fail if the top-10 board is empty
        if: steps.predict.outputs.skipped != 'true'
        run: |
          YEAR=$(python -c "import config; print(config.SEASON_END_YEAR)")
          CSV="predictions/${YEAR}/top10_mvp_latest.csv"
          ROWS=$(( $(wc -l < "$CSV") - 1 ))
          echo "$CSV has $ROWS rows"
          if [ "$ROWS" -lt 1 ]; then
            echo "::error::Top-10 MVP board is empty"
            exit 1
          fi

      # A player new to the slides (ranks 1-15) has no headshot until stinger-assets' daily sync, which only
      # sees him after this run commits. Fetch any missing ones now (this sport's ESPN rosters only, ~25 s;
      # nothing is committed to stinger-assets, its daily sync does that). If one still can't be found, fail
      # here, before the commit, so a slide with a blank circle never reaches the site or the social draft.
      - name: Fetch missing headshots
        id: headshots
        if: steps.predict.outputs.skipped != 'true'
        run: |
          YEAR=$(python -c "import config; print(config.SEASON_END_YEAR)")
          python stinger-assets/sync_espn_headshots.py fetch --sport nba --board "predictions/${YEAR}/board_mvp_latest.csv" --strict

      - name: Re-render the slides with the new headshots
        if: steps.predict.outputs.skipped != 'true' && steps.headshots.outputs.downloaded != '0'
        run: python -m src.publish.render_graphics
        env:
          PYTHONIOENCODING: utf-8
          STINGER_ASSETS_DIR: ${{ github.workspace }}/stinger-assets

      # Legacy feed for the website's Google Sheet (IMPORTDATA of the Pages files).
      - name: Build Canva flats + copy the legacy feed to docs/
        if: steps.predict.outputs.skipped != 'true'
        run: |
          python -m src.publish.build_canva_flat_nba
          python -m src.publish.publish_pages

      - name: Upload prediction artifacts
        if: steps.predict.outputs.skipped != 'true'
        uses: actions/upload-artifact@v4
        with:
          name: nba-mvp-${{ github.run_number }}
          path: |
            predictions/**/*.csv
            predictions/**/*.png
            predictions/**/*.txt
          retention-days: 90
          if-no-files-found: warn

      - name: Commit updated predictions
        if: steps.predict.outputs.skipped != 'true'
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          YEAR=$(python -c "import config; print(config.SEASON_END_YEAR)")
          git add predictions/ docs/nba/mvp/*.csv
          # Hidden movement baseline (30 rows); -f in case a global ignore covers dotfiles
          if [ -f "predictions/${YEAR}/.prev_board_mvp.csv" ]; then
            git add -f "predictions/${YEAR}/.prev_board_mvp.csv"
          fi
          if git diff --staged --quiet; then
            echo "No changes to commit."
          else
            git commit -m "Automated NBA MVP update $(date -u +'%Y-%m-%d %H:%M UTC') [skip ci]"
            git push
          fi

      - name: Setup Pages
        if: steps.predict.outputs.skipped != 'true'
        uses: actions/configure-pages@v5

      - name: Upload Pages artifact
        if: steps.predict.outputs.skipped != 'true'
        uses: actions/upload-pages-artifact@v3
        with:
          path: docs

      - name: Deploy to GitHub Pages
        if: steps.predict.outputs.skipped != 'true'
        id: deployment
        uses: actions/deploy-pages@v4
